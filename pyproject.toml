[project]
name = "invoice-agent"
version = "0.1.0"
description = "LangGraph invoice agent: the model reads, tested code decides."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nityashree S" }]
# Keep in step with requirements.txt (Vercel may read either).
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.38",
    "python-multipart>=0.0.20",
    "pydantic>=2.11,<3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "numpy>=2.0,<3",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
# The MCP server (python -m invoice_agent.mcp_server). Kept out of the Vercel bundle.
mcp = ["mcp>=2.1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoice_agent"]

[tool.setuptools.package-data]
invoice_agent = ["web/*.html"]
